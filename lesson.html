<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>School lessons · Johan Frost</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f111c;
            --bg-secondary: rgba(20, 22, 36, 0.92);
            --bg-card: rgba(30, 30, 48, 0.85);
            --text-primary: #f5eeff;
            --text-secondary: #cbbaff;
            --text-lesson: #f0ebff;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --accent: #ffb057;
            --accent-glow: rgba(255, 160, 70, 0.3);
            --input-bg: rgba(255, 255, 255, 0.06);
            --status-ongoing: #ffd700;
            --status-next: #6ab0ff;
            --status-done: #00ff88;
            --status-waiting: rgba(255, 255, 255, 0.2);
        }

        [data-theme="default"] { --accent: #ffb057; --accent-glow: rgba(255, 160, 70, 0.3); }
        [data-theme="japan"] { --accent: #ff2d55; --accent-glow: rgba(255, 45, 85, 0.3); --bg-primary: #1a0a0a; }
        [data-theme="canada"] { --accent: #ff4d4d; --accent-glow: rgba(255, 77, 77, 0.3); --bg-primary: #0a1a0a; }
        [data-theme="uzbekistan"] { --accent: #00b894; --accent-glow: rgba(0, 184, 148, 0.3); --bg-primary: #0a0a1a; }
        [data-theme="rezero"] { --accent: #e040a0; --accent-glow: rgba(224, 64, 160, 0.3); --bg-primary: #1a0a1a; }
        [data-theme="emilia"] { --accent: #7ec8e3; --accent-glow: rgba(126, 200, 227, 0.3); --bg-primary: #0a0a1a; }
        [data-theme="rem"] { --accent: #4a90d9; --accent-glow: rgba(74, 144, 217, 0.3); --bg-primary: #0a0a1a; }
        [data-theme="ram"] { --accent: #e86a8a; --accent-glow: rgba(232, 106, 138, 0.3); --bg-primary: #1a0a0a; }
        [data-theme="subaru"] { --accent: #ff6b35; --accent-glow: rgba(255, 107, 53, 0.3); --bg-primary: #1a0a0a; }
        [data-theme="naruto"] { --accent: #ff6b00; --accent-glow: rgba(255, 107, 0, 0.3); --bg-primary: #1a0a00; }
        [data-theme="sakura"] { --accent: #ff6b9d; --accent-glow: rgba(255, 107, 157, 0.3); --bg-primary: #1a0a0a; }
        [data-theme="sasuke"] { --accent: #1a1aff; --accent-glow: rgba(26, 26, 255, 0.3); --bg-primary: #0a0a0a; }
        [data-theme="itachi"] { --accent: #cc0000; --accent-glow: rgba(204, 0, 0, 0.3); --bg-primary: #0a0000; }
        [data-theme="goku"] { --accent: #ff6b00; --accent-glow: rgba(255, 107, 0, 0.3); --bg-primary: #0a0a0a; }
        [data-theme="kiyotaka"] { --accent: #c0c0c0; --accent-glow: rgba(192, 192, 192, 0.2); --bg-primary: #0a0a0a; }
        [data-theme="kira"] { --accent: #ff0040; --accent-glow: rgba(255, 0, 64, 0.3); --bg-primary: #0a0000; }
        [data-theme="l"] { --accent: #ffffff; --accent-glow: rgba(255, 255, 255, 0.2); --bg-primary: #0a0a0a; }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px 15px;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            transition: background 0.5s ease;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 15% 30%, var(--accent-glow) 0%, transparent 45%),
                        radial-gradient(circle at 85% 70%, var(--accent-glow) 0%, transparent 45%);
            transition: all 0.5s ease;
            opacity: 0.15;
        }

        .timetable-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px 18px;
            box-shadow: 0 18px 35px var(--shadow-color), 0 0 30px var(--accent-glow);
            border: 1px solid var(--border-color);
            transition: all 0.5s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .main-title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.5s ease;
        }

        .made-by {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .clock {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--input-bg);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-variant-numeric: tabular-nums;
            min-width: 120px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .clock:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .theme-selector select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .theme-selector select:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .theme-selector select option {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }

        .day-card {
            background: var(--bg-card);
            border-radius: 22px;
            padding: 16px 12px 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 18px var(--shadow-color);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
        }

        .day-card:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: var(--accent);
            box-shadow: 0 18px 30px var(--shadow-color), 0 0 30px var(--accent-glow);
        }

        .day-card.today {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), 0 18px 30px var(--shadow-color);
        }

        .day-card.today .day-title {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .day-card.past {
            opacity: 0.4;
            filter: grayscale(0.5);
        }

        .day-card.future {
            opacity: 0.7;
        }

        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--border-color);
            flex-wrap: wrap;
            gap: 4px;
        }

        .day-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .day-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        .day-emoji {
            font-style: normal;
            font-size: 1.3rem;
        }

        .day-badge {
            font-size: 0.55rem;
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .day-stats {
            display: flex;
            gap: 8px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .lesson-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .lesson-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-lesson);
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-size: 0.85rem;
            position: relative;
        }

        .lesson-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-left-color: var(--accent);
            transform: translateX(4px);
        }

        .lesson-item.status-ongoing {
            background: rgba(255, 215, 0, 0.15);
            border-left-color: var(--status-ongoing);
        }

        .lesson-item.status-next {
            border-left-color: var(--status-next);
            background: rgba(106, 176, 255, 0.08);
        }

        .lesson-item.status-done {
            opacity: 0.5;
            border-left-color: var(--status-done);
        }

        .lesson-item.status-waiting {
            opacity: 0.3;
        }

        .lesson-item .lesson-number {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .lesson-item:hover .lesson-number {
            background: var(--accent);
            color: #fff;
            transform: scale(1.1);
        }

        .lesson-item .lesson-name {
            text-transform: capitalize;
            word-break: break-word;
            flex: 1;
            font-size: 0.85rem;
        }

        .lesson-item .lesson-time {
            font-size: 0.6rem;
            color: var(--text-secondary);
            opacity: 0.7;
            flex-shrink: 0;
            font-weight: 400;
        }

        .lesson-item .lesson-status-badge {
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            flex-shrink: 0;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        .badge-ongoing {
            background: var(--status-ongoing);
            color: #000;
        }

        .badge-next {
            background: var(--status-next);
            color: #fff;
        }

        .badge-done {
            background: var(--status-done);
            color: #000;
        }

        .badge-waiting {
            background: var(--status-waiting);
            color: var(--text-secondary);
        }

        /* Telegram Watermark - More Visible & Tappable */
        .watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            background: rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            min-height: 50px;
            min-width: 140px;
        }

        .watermark:hover {
            transform: scale(1.08);
            border-color: #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4), 0 8px 32px rgba(0, 0, 0, 0.6);
            background: rgba(255, 215, 0, 0.25);
        }

        .watermark:active {
            transform: scale(0.95);
        }

        .watermark .watermark-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
        }

        .watermark .watermark-text {
            color: #ffffff;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .watermark .watermark-text span {
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .watermark .watermark-badge {
            background: #ffd700;
            color: #000;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .controls {
                justify-content: center;
                flex-wrap: wrap;
            }
            .main-title {
                font-size: 1.4rem;
                text-align: center;
            }
            .made-by {
                text-align: center;
            }
            .days-grid {
                grid-template-columns: 1fr;
            }
            .clock {
                font-size: 0.8rem;
                min-width: auto;
            }
            .watermark {
                bottom: 16px;
                right: 16px;
                padding: 10px 18px;
                min-height: 44px;
                min-width: 120px;
            }
            .watermark .watermark-text {
                font-size: 0.9rem;
            }
            .watermark .watermark-icon {
                font-size: 1.2rem;
            }
            .watermark .watermark-badge {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Telegram Watermark - More Visible & Tappable -->
    <a href="https://t.me/qwastur" target="_blank" class="watermark" aria-label="Telegram @qwastur">
        <span class="watermark-icon">✈️</span>
        <span class="watermark-text">@<span>qwastur</span></span>
        <span class="watermark-badge">✦</span>
    </a>

    <div class="timetable-wrapper">
        <div class="top-bar">
            <div>
                <div class="main-title">HAFTALIK DARS JADVALI</div>
                <div class="made-by">Johan Frost · Real-time</div>
            </div>
            <div class="controls">
                <div class="clock" id="clock">--:--</div>
                <div class="theme-selector">
                    <select id="themeSelect">
                        <option value="default">Default</option>
                        <option value="japan">Japan</option>
                        <option value="canada">Canada</option>
                        <option value="uzbekistan">Uzbekistan</option>
                        <option value="rezero">Re:Zero</option>
                        <option value="emilia">Emilia</option>
                        <option value="rem">Rem</option>
                        <option value="ram">Ram</option>
                        <option value="subaru">Subaru</option>
                        <option value="naruto">Naruto</option>
                        <option value="sakura">Sakura</option>
                        <option value="sasuke">Sasuke</option>
                        <option value="itachi">Itachi</option>
                        <option value="goku">Goku</option>
                        <option value="kiyotaka">Kiyotaka</option>
                        <option value="kira">Kira</option>
                        <option value="l">L</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="days-grid" id="daysGrid"></div>
    </div>

    <script>
        // ============= DATA =============
        const daysData = [
            { id: 'dushanba', name: 'Dushanba', emoji: '🌅', lessons: ['Kelajak soati', 'Matematika', 'Adabiyot', 'Ona tili', 'Fizika', 'Geografiya'] },
            { id: 'seshanba', name: 'Seshanba', emoji: '⛅', lessons: ['Kimyo', 'Matematika', 'Ingliz tili', 'Tarix'] },
            { id: 'chorshanba', name: 'Chorshanba', emoji: '🌦️', lessons: ['Tarix', 'Rus tili', 'Informatika', 'Jismoniy tarbiya', 'ChQBT'] },
            { id: 'payshanba', name: 'Payshanba', emoji: '🌧️', lessons: ['Rus tili', 'Jismoniy tarbiya', 'Geografiya', 'Adabiyot', 'ChQBT', 'Ingliz tili'] },
            { id: 'juma', name: 'Juma', emoji: '🌈', lessons: ['Kimyo', 'Matematika', 'Informatika', 'Huquq', 'Biologiya'] },
            { id: 'shanba', name: 'Shanba', emoji: '🌙', lessons: ['Biologiya', 'Matematika', 'Tarbiya', 'Fizika', 'Ona tili', 'Matematika'] }
        ];

        const dayOrder = ['dushanba', 'seshanba', 'chorshanba', 'payshanba', 'juma', 'shanba'];

        function getLessonTimes() {
            const times = [];
            const schedule = [
                { start: 8 * 60, end: 8 * 60 + 45 },
                { start: 8 * 60 + 50, end: 8 * 60 + 95 },
                { start: 9 * 60 + 40, end: 9 * 60 + 85 },
                { start: 10 * 60 + 35, end: 10 * 60 + 80 },
                { start: 11 * 60 + 25, end: 11 * 60 + 70 },
                { start: 12 * 60 + 15, end: 12 * 60 + 60 }
            ];
            schedule.forEach((s, i) => {
                times.push({ start: s.start, end: s.end, lessonNum: i + 1 });
            });
            return times;
        }

        const LESSON_TIMES = getLessonTimes();

        function getTashkentTime() {
            const now = new Date();
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            let hours = utcHours + 5;
            if (hours >= 24) hours -= 24;
            return { hours, minutes: utcMinutes };
        }

        function getCurrentMinutes() {
            const t = getTashkentTime();
            return t.hours * 60 + t.minutes;
        }

        function getCurrentDayName() {
            const now = new Date();
            const days = ['yakshanba', 'dushanba', 'seshanba', 'chorshanba', 'payshanba', 'juma', 'shanba'];
            return days[now.getDay()];
        }

        function getLessonStatus(lessonIndex) {
            const currentMinutes = getCurrentMinutes();
            if (lessonIndex >= LESSON_TIMES.length) return 'waiting';
            const { start, end } = LESSON_TIMES[lessonIndex];
            if (currentMinutes >= start && currentMinutes < end) return 'ongoing';
            if (currentMinutes < start) return 'next';
            return 'done';
        }

        function getDayStatus(dayId) {
            const todayName = getCurrentDayName();
            if (dayId === todayName) return 'today';
            const dayIndex = dayOrder.indexOf(dayId);
            const todayIndex = dayOrder.indexOf(todayName);
            if (todayIndex === -1) return 'future';
            return dayIndex < todayIndex ? 'past' : 'future';
        }

        function formatTime(minutes) {
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        // ============= RENDER =============
        function render() {
            const grid = document.getElementById('daysGrid');
            const todayName = getCurrentDayName();

            let html = '';

            dayOrder.forEach((dayId, dayIndex) => {
                const day = daysData.find(d => d.id === dayId);
                if (!day) return;

                const dayStatus = getDayStatus(dayId);
                const isToday = dayStatus === 'today';
                const isPast = dayStatus === 'past';
                const isFuture = dayStatus === 'future';

                let lessonsHtml = '';

                day.lessons.forEach((lesson, idx) => {
                    const status = getLessonStatus(idx);
                    let statusClass = `status-${status}`;
                    let badgeHtml = '';
                    let timeHtml = '';

                    const timeInfo = LESSON_TIMES[idx];
                    if (timeInfo) {
                        timeHtml = `<span class="lesson-time">${formatTime(timeInfo.start)}-${formatTime(timeInfo.end)}</span>`;
                    }

                    if (isToday) {
                        const statusLabels = {
                            'ongoing': '<span class="lesson-status-badge badge-ongoing">● Davom etmoqda</span>',
                            'next': '<span class="lesson-status-badge badge-next">▶ Keyingi</span>',
                            'done': '<span class="lesson-status-badge badge-done">✓ Tugagan</span>',
                            'waiting': '<span class="lesson-status-badge badge-waiting">◌ Kutilmoqda</span>'
                        };
                        badgeHtml = statusLabels[status] || '';
                    }

                    lessonsHtml += `
                        <li class="lesson-item ${statusClass}">
                            <span class="lesson-number">${idx + 1}</span>
                            <span class="lesson-name">${lesson}</span>
                            ${timeHtml}
                            ${badgeHtml}
                        </li>
                    `;
                });

                const lessonCount = day.lessons.length;

                html += `
                    <div class="day-card ${isToday ? 'today' : ''} ${isPast ? 'past' : ''} ${isFuture ? 'future' : ''}">
                        <div class="day-header">
                            <div class="day-title-wrap">
                                <span class="day-title">${day.name} <span class="day-emoji">${day.emoji}</span></span>
                                ${isToday ? `<span class="day-badge">● BUGUN</span>` : ''}
                            </div>
                            <div class="day-stats">
                                <span>${lessonCount} dars</span>
                            </div>
                        </div>
                        <ul class="lesson-list">
                            ${lessonsHtml}
                        </ul>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // ============= CLOCK =============
        function updateClock() {
            const t = getTashkentTime();
            const timeStr = `${t.hours.toString().padStart(2, '0')}:${t.minutes.toString().padStart(2, '0')}`;
            document.getElementById('clock').textContent = timeStr;
        }

        // ============= THEME =============
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('timetableTheme', theme);
            document.getElementById('themeSelect').value = theme;
        }

        document.getElementById('themeSelect').addEventListener('change', function() {
            setTheme(this.value);
        });

        // ============= INIT =============
        const savedTheme = localStorage.getItem('timetableTheme') || 'default';
        setTheme(savedTheme);

        render();
        updateClock();

        setInterval(updateClock, 1000);
        setInterval(render, 5000);
    </script>
</body>
</html>
